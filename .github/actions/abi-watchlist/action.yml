name: 'ABI watchlist'
description: 'Diff this build’s symbol CRCs against the stock GKI ABI (android/abi_gki_aarch64.stg)'

runs:
  using: composite
  steps:
    - name: Compare Module.symvers CRCs against the stock ABI definition
      # Why this exists: the kleaf builds in this repo strip the ABI lists
      # (remove-protected-exports), so bazel never runs the protected-exports
      # check and a config that grows an ABI struct cannot fail or even warn.
      # For legacy build.sh families the comparison runs, but only against a list
      # generated from the same tree.
      #
      # android/abi_gki_aarch64.stg is the stock GKI ABI definition: it carries
      # `id: 0x<CRC>` next to every tracked symbol, so our Module.symvers can be
      # diffed against the real stock CRCs. Non-fatal by design - it reports,
      # so a deliberate port like fanotify's shows up as "no drift" and an
      # accidental one shows up as a named symbol.
      shell: bash
      run: |
        set -uo pipefail

        OURS=$(find -L . "${OUT_DIR:-/home/runner/out}" -maxdepth 8 \
                 -name 'Module.symvers' -type f -size +0 2>/dev/null | head -n1)
        STG=$(find -L . "${OUT_DIR:-/home/runner/out}" -maxdepth 8 \
                -name 'abi_gki_aarch64.stg' -type f -size +0 2>/dev/null | head -n1)

        if [ -z "${OURS:-}" ] || [ ! -f "$OURS" ]; then
          echo "ABI watchlist: no Module.symvers found (skipped)"
          exit 0
        fi
        if [ -z "${STG:-}" ] || [ ! -f "$STG" ]; then
          echo "ABI watchlist: no abi_gki_aarch64.stg found (skipped); symvers=$OURS"
          exit 0
        fi
        echo "ABI watchlist: ours=$OURS stock=$STG"

        # Module.symvers: <crc> <symbol> <module> <export>
        awk -F'\t' 'NF>=2 && $1 ~ /^0x/ {print $2"\t"$1}' "$OURS" | LC_ALL=C sort -u > /tmp/ours.tsv

        # .stg records are:
        #   elf_symbol {
        #     id: 0x…  name: "sym"  is_defined: true  symbol_type: FUNCTION
        #     crc: 0x…  type_id: 0x…  full_name: "sym"
        #   }
        # The CRC that modversions compares is `crc:`, not `id:`.
        awk '
          /^elf_symbol \{/ {insym=1; nm=""; crc=""; next}
          insym && /^[[:space:]]*name:[[:space:]]*"/ {
            nm=$0; sub(/.*name:[[:space:]]*"/, "", nm); sub(/".*/, "", nm); next
          }
          insym && /^[[:space:]]*crc:[[:space:]]*0x/ {crc=$2; next}
          insym && /^\}/ {
            if (nm != "" && crc != "") print nm"\t"crc;
            insym=0; next
          }
        ' "$STG" | LC_ALL=C sort -u > /tmp/stock.tsv

        # join wants byte order, not the locale's collation
        compared=$(LC_ALL=C join -t $'\t' -1 1 -2 1 /tmp/ours.tsv /tmp/stock.tsv | wc -l)
        drift=$(LC_ALL=C join -t $'\t' -1 1 -2 1 /tmp/ours.tsv /tmp/stock.tsv | awk -F'\t' '$2!=$3')
        drifted=$(printf '%s' "$drift" | grep -c . || true)

        {
          echo ""
          echo "### ABI vs stock GKI"
          echo ""
          echo "Compared **$compared** symbols present in both this build and"
          echo "\`android/abi_gki_aarch64.stg\`; **$drifted** differ."
          echo ""
          if [ "$drifted" -gt 0 ]; then
            echo "| symbol | this build | stock |"
            echo "|---|---|---|"
            printf '%s\n' "$drift" | head -40 | awk -F'\t' '{printf "| %s | %s | %s |\n", $1,$2,$3}'
            [ "$drifted" -gt 40 ] && echo "" && echo "_… first 40 of $drifted; full list in the job log._"
          else
            echo "No watched symbol drifted."
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

        if [ "$drifted" -gt 0 ]; then
          echo "ABI DRIFT ($drifted symbols differ from stock):"
          printf '%s\n' "$drift" | head -60
        else
          echo "ABI: $compared symbols compared, none drifted"
        fi
